[program:docker]
; --storage-driver=fuse-overlayfs avoids the classic nested-Docker-in-Docker failure: the default
; overlay2 driver can't mount on top of a host filesystem that's already overlay2 (most Docker
; hosts are) - "failed to mount ... overlay ... invalid argument" on every `docker run`, even
; though dockerd itself starts fine and `docker ps`/pull work. fuse-overlayfs is a userspace
; implementation that sidesteps the restriction.
command=dockerd --host=unix:///var/run/docker.sock --storage-driver=fuse-overlayfs
; Deliberately no user= override (unlike jupyter/vscode) - dockerd needs to run as this
; container's own root, which is safe only because the host is expected to run this container
; under the sysbox-runc runtime, remapping that root to an unprivileged host UID.
priority=20
autostart=true
autorestart=true
stderr_logfile=/proc/1/fd/1 ; log error into stdout to see in docker logs
stderr_logfile_maxbytes=0
stdout_logfile=/var/log/supervisor/%(program_name)s.log ; log logs into file
startretries=5   ; max # of serial start failures (default 3)
